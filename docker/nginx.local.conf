# 전체 로컬 테스트에서 SPA fallback과 개발 인증 proxy를 한 origin으로 제공한다.
server {
  listen 80;
  server_name localhost;
  root /usr/share/nginx/html;

  location /api/ {
    proxy_set_header Host $host;
    proxy_set_header X-Dev-User-Sub local-admin-sub;
    proxy_pass http://api:3000;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
