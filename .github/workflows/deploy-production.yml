name: deploy-production

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CDK_ACCOUNT: ${{ vars.AWS_ACCOUNT_ID }}
      ROOT_DOMAIN: ${{ vars.ROOT_DOMAIN }}
      HOSTED_ZONE_ID: ${{ vars.HOSTED_ZONE_ID }}
      ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
      ALLOWED_EMAIL_DOMAINS: ${{ vars.ALLOWED_EMAIL_DOMAINS }}
      MONTHLY_BUDGET_USD: ${{ vars.MONTHLY_BUDGET_USD }}
      MEDIA_PUBLIC_KEY_PEM: ${{ vars.MEDIA_PUBLIC_KEY_PEM }}
      TTS_VOICE_PRESET_ID: ${{ vars.TTS_VOICE_PRESET_ID }}
      TTS_VOICE_PRESET_NAME: ${{ vars.TTS_VOICE_PRESET_NAME }}
      TTS_PROVIDER_NAME: ${{ vars.TTS_PROVIDER_NAME }}
      TTS_PROVIDER_MODEL: ${{ vars.TTS_PROVIDER_MODEL }}
      TTS_PROVIDER_VOICE: ${{ vars.TTS_PROVIDER_VOICE }}
      TTS_GENERATION_REVISION: ${{ vars.TTS_GENERATION_REVISION }}
      GITHUB_REPOSITORY_CONTEXT: ${{ github.repository }}
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v6.0.2

      - name: pnpm 준비
        uses: pnpm/action-setup@v6.0.8
        with:
          version: 10.33.0

      - name: Node.js 준비
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: 운영 설정 확인
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        run: |
          required=(
            CDK_ACCOUNT
            ROOT_DOMAIN
            HOSTED_ZONE_ID
            ALERT_EMAIL
            ALLOWED_EMAIL_DOMAINS
            MONTHLY_BUDGET_USD
            MEDIA_PUBLIC_KEY_PEM
            TTS_VOICE_PRESET_ID
            TTS_VOICE_PRESET_NAME
            TTS_PROVIDER_NAME
            TTS_PROVIDER_MODEL
            TTS_PROVIDER_VOICE
            TTS_GENERATION_REVISION
            AWS_DEPLOY_ROLE_ARN
          )

          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::GitHub production environment의 $name 값이 비어 있습니다."
              exit 1
            fi
          done

          if [[ ! "$CDK_ACCOUNT" =~ ^[0-9]{12}$ ]]; then
            echo "::error::AWS_ACCOUNT_ID는 12자리 숫자여야 합니다."
            exit 1
          fi

          if [[ "$MEDIA_PUBLIC_KEY_PEM" != *"BEGIN PUBLIC KEY"* ]]; then
            echo "::error::MEDIA_PUBLIC_KEY_PEM은 PEM 공개 키여야 합니다."
            exit 1
          fi

          if [[ ! "$TTS_VOICE_PRESET_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$ ]]; then
            echo "::error::TTS_VOICE_PRESET_ID는 UUID여야 합니다."
            exit 1
          fi

      - name: 코드 검사
        run: |
          pnpm check
          pnpm infra:synth

      - name: production web artifact build
        run: node scripts/build-production-web.mjs "$ROOT_DOMAIN"

      - name: AWS 임시 배포 권한 받기
        uses: aws-actions/configure-aws-credentials@v6.2.2
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: flex-thia-production
          aws-region: ap-northeast-2
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}

      - name: 연결된 AWS 계정 확인
        run: aws sts get-caller-identity

      - name: AWS 변경 내용 확인
        run: >-
          pnpm --filter @flex-thia/infra exec cdk diff -c "account=$CDK_ACCOUNT" -c "rootDomain=$ROOT_DOMAIN" -c "hostedZoneId=$HOSTED_ZONE_ID" -c "alertEmail=$ALERT_EMAIL" -c "githubRepository=$GITHUB_REPOSITORY_CONTEXT" -c "allowedEmailDomains=$ALLOWED_EMAIL_DOMAINS" -c "monthlyBudgetUsd=$MONTHLY_BUDGET_USD" -c "ttsVoicePresetId=$TTS_VOICE_PRESET_ID"

      - name: 데이터 기반 배포
        run: >-
          pnpm --filter @flex-thia/infra exec cdk deploy FlexThiaDataProd --require-approval never --outputs-file "$GITHUB_WORKSPACE/cdk-outputs.json" -c "account=$CDK_ACCOUNT" -c "rootDomain=$ROOT_DOMAIN" -c "hostedZoneId=$HOSTED_ZONE_ID" -c "alertEmail=$ALERT_EMAIL" -c "githubRepository=$GITHUB_REPOSITORY_CONTEXT" -c "allowedEmailDomains=$ALLOWED_EMAIL_DOMAINS" -c "monthlyBudgetUsd=$MONTHLY_BUDGET_USD" -c "ttsVoicePresetId=$TTS_VOICE_PRESET_ID"

      - name: 데이터베이스 migration 설정 읽기
        run: |
          jq -e \
            '.FlexThiaDataProd.ClusterArn and .FlexThiaDataProd.SecretArn' \
            "$GITHUB_WORKSPACE/cdk-outputs.json" >/dev/null

          {
            echo "RDS_RESOURCE_ARN=$(jq -r '.FlexThiaDataProd.ClusterArn' "$GITHUB_WORKSPACE/cdk-outputs.json")"
            echo "RDS_SECRET_ARN=$(jq -r '.FlexThiaDataProd.SecretArn' "$GITHUB_WORKSPACE/cdk-outputs.json")"
            echo "DATABASE_NAME=flex_thia"
            echo "AWS_REGION=ap-northeast-2"
          } >> "$GITHUB_ENV"

      - name: Aurora Data API 준비 대기
        run: pnpm --filter @flex-thia/database db:wait:data-api

      - name: 운영 데이터베이스 migration
        run: pnpm --filter @flex-thia/database db:migrate:data-api

      - name: 운영 TTS 음성 preset bootstrap
        run: pnpm --filter @flex-thia/database db:bootstrap:tts-voice:data-api

      - name: API와 웹 진입점 배포
        run: >-
          pnpm --filter @flex-thia/infra exec cdk deploy FlexThiaApplicationProd FlexThiaEdgeProd --require-approval never -c "account=$CDK_ACCOUNT" -c "rootDomain=$ROOT_DOMAIN" -c "hostedZoneId=$HOSTED_ZONE_ID" -c "alertEmail=$ALERT_EMAIL" -c "githubRepository=$GITHUB_REPOSITORY_CONTEXT" -c "allowedEmailDomains=$ALLOWED_EMAIL_DOMAINS" -c "monthlyBudgetUsd=$MONTHLY_BUDGET_USD" -c "ttsVoicePresetId=$TTS_VOICE_PRESET_ID"
