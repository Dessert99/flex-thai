name: check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v6.0.2

      - name: pnpm 준비
        uses: pnpm/action-setup@v6.0.8
        with:
          version: 10.33.0

      - name: Node.js 준비
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: 코드 검사
        run: pnpm check

      - name: AWS 설계도 생성
        run: pnpm infra:synth
