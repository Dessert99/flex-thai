name: check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PRACTICE_DATABASE_URL: postgresql://flex_thia:integration_password@localhost:5432/flex_thia
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: flex_thia
          POSTGRES_PASSWORD: integration_password
          POSTGRES_USER: flex_thia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flex_thia -d flex_thia" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v6.0.2

      - name: pnpm 준비
        uses: pnpm/action-setup@v6.0.8
        with:
          version: 10.33.0

      - name: Node.js 준비
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: PostgreSQL migration 적용
        run: pnpm --filter @flex-thia/database db:migrate:local
        env:
          DATABASE_URL: ${{ env.PRACTICE_DATABASE_URL }}

      - name: 코드 검사
        run: pnpm check
        env:
          VOCABULARY_PRACTICE_TEST_DATABASE_URL: ${{ env.PRACTICE_DATABASE_URL }}

      - name: AWS 설계도 생성
        run: pnpm infra:synth
