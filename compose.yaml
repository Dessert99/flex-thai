# 로컬 DB 초기화와 API·프론트 실행 모드를 같은 서비스 정의로 재현한다.
x-app-environment: &app-environment
  AUTH_MODE: fake
  DATABASE_MODE: local
  DATABASE_URL: postgres://flex_thia:local_only_password@postgres:5432/flex_thia
  FAKE_USER_SUB: local-admin-sub
  FAKE_USER_EMAIL: admin@hufs.ac.kr
  FAKE_LEARNER_SUB: local-learner-sub
  FAKE_LEARNER_EMAIL: learner@hufs.ac.kr
  CHALLENGE_HMAC_PEPPER: local-only-email-challenge-pepper
  EMAIL_LINK_CONFIRMATION_URL: ${FLEX_THIA_LOCAL_PUBLIC_ORIGIN:-http://localhost:5173}/login/confirm
  ALLOWED_ORIGINS: ${FLEX_THIA_LOCAL_PUBLIC_ORIGIN:-http://localhost:5173}
  FLEX_THIA_LOCAL_TTS_AUDIO_DIRECTORY: /var/lib/flex-thia/tts-audio
  FLEX_THIA_LOCAL_UPLOAD_DIRECTORY: /var/lib/flex-thia/uploads
  FLEX_THIA_LOCAL_API_ORIGIN: http://localhost:3000
  FLEX_THIA_LOCAL_PUBLIC_ORIGIN: ${FLEX_THIA_LOCAL_PUBLIC_ORIGIN:-http://localhost:5173}
  FLEX_THIA_LOCAL_MEDIA_HMAC_SECRET: local-only-media-read-hmac-secret

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: flex_thia
      POSTGRES_USER: flex_thia
      POSTGRES_PASSWORD: local_only_password
    ports:
      - '${FLEX_THIA_POSTGRES_HOST_PORT:-55432}:5432'
    volumes:
      - flex-thia-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U flex_thia -d flex_thia']
      interval: 2s
      timeout: 2s
      retries: 15

  db-setup:
    profiles: [reset]
    build:
      context: .
      dockerfile: Dockerfile.local
      target: workspace
    command:
      - /bin/sh
      - -ec
      - pnpm --filter @flex-thia/database db:reset-seed:local && pnpm --filter @flex-thia/providers seed:local-media
    environment:
      <<: *app-environment
      LOCAL_DATABASE_RESET: 'true'
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - flex-thia-tts-audio:/var/lib/flex-thia/tts-audio
    restart: 'no'

  api:
    profiles: [test, frontend-dev]
    build:
      context: .
      dockerfile: Dockerfile.local
      target: api
    environment:
      <<: *app-environment
      NODE_ENV: development
      PORT: '3000'
    ports:
      - '${FLEX_THIA_API_HOST_PORT:-53000}:3000'
    volumes:
      - flex-thia-tts-audio:/var/lib/flex-thia/tts-audio
      - flex-thia-uploads:/var/lib/flex-thia/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/ready >/dev/null']
      interval: 2s
      timeout: 2s
      retries: 30

  local-worker:
    profiles: [test, workers]
    build:
      context: .
      dockerfile: Dockerfile.local
      target: workspace
    command:
      - pnpm
      - --filter
      - '@flex-thia/worker'
      - exec
      - tsx
      - src/local-worker.ts
    environment:
      <<: *app-environment
    volumes:
      - flex-thia-tts-audio:/var/lib/flex-thia/tts-audio
      - flex-thia-uploads:/var/lib/flex-thia/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    profiles: [test]
    build:
      context: .
      dockerfile: Dockerfile.local
      target: web
    ports:
      - '${FLEX_THIA_WEB_HOST_PORT:-5173}:80'
    depends_on:
      api:
        condition: service_healthy

volumes:
  flex-thia-postgres-data:
  flex-thia-tts-audio:
  flex-thia-uploads:
